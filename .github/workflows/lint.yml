name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Conferir sintaxe do PHP (php -l)
        run: |
          find . -path ./.git -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Conferir sintaxe do JavaScript (node --check)
        run: |
          node --version
          for f in glpichatbot/public/js/*.js; do
            echo "$f"
            node --check "$f"
          done
